name: Verify optional Shiloh runtime
on:
  push:
    paths:
      - 'bridge/**'
      - 'engines/xfiles/**'
      - '.github/workflows/shiloh.yml'
      - 'tools/install_engine.py'
      - 'tools/collect_rust_notices.py'
      - 'tools/verify_windows_package.py'
      - 'Prepara-e-Avvia.ps1'
      - 'Avvia-XFiles*.cmd'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ffi-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - name: Check ABI library and run bridge tests
        run: cargo test --locked --manifest-path bridge/Cargo.toml --lib
      - name: Record resolved dependency lock for review
        run: cat bridge/Cargo.lock
      - name: Check dependency notice packaging
        run: python3 tools/collect_rust_notices.py --manifest bridge/Cargo.toml --output bridge/RUNTIME-DEPENDENCIES.txt
  windows-runtime:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          targets: x86_64-pc-windows-gnu
      - uses: actions/cache@v4
        with:
          path: |
            bridge/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-bridge-1.100.0-${{ runner.os }}-gnu-${{ hashFiles('bridge/Cargo.toml', 'bridge/Cargo.lock') }}
          restore-keys: rust-bridge-1.100.0-${{ runner.os }}-gnu-
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            python
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-freetype
      - name: Build pinned in-process runtime without SDL frontend
        run: |
          export PATH="$(cygpath -u "$USERPROFILE")/.cargo/bin:$PATH"
          cargo build --locked --manifest-path bridge/Cargo.toml --release --target x86_64-pc-windows-gnu
      - name: Collect native Windows dependency notices
        shell: pwsh
        run: python tools/collect_rust_notices.py --manifest bridge/Cargo.toml --output bridge/RUNTIME-DEPENDENCIES.txt
      - name: Build ScummVM host with Rust runtime linked statically
        run: |
          git init upstream
          git -C upstream remote add origin https://github.com/scummvm/scummvm.git
          git -C upstream fetch --depth=1 origin 55c2973c1df5e8790b4248ae36a6b1b37842ce12
          git -C upstream checkout FETCH_HEAD
          python tools/install_engine.py upstream
          cd upstream
          ./configure --disable-all-engines --enable-engine=xfiles --disable-debug --disable-updates --disable-cloud --disable-discord --disable-tts --disable-libcurl --enable-freetype2 --opengl-mode=none
          printf '\n#define USE_XFILES_SHILOH\n' >> config.h
          printf '\nLIBS += %s/../bridge/target/x86_64-pc-windows-gnu/release/libxfiles_shiloh.a -luserenv -lws2_32 -lbcrypt -lntdll -lsynchronization\n' "$PWD" >> config.mk
          make -j4
          mkdir -p ../runtime
          cp scummvm.exe ../runtime/
          ldd scummvm.exe | awk '/\/mingw64\/bin\// {print $3}' | while read -r dll; do cp "$dll" ../runtime/; done
          cp ../bridge/target/x86_64-pc-windows-gnu/release/smoke.exe ../runtime/xfiles-shiloh-smoke.exe
          cp ../README.md ../LICENSE ../THIRD_PARTY.md ../runtime/
          cp ../bridge/SHILOH-NOTICES.txt ../runtime/
          cp ../bridge/RUNTIME-DEPENDENCIES.txt ../runtime/
          cp ../Prepara-e-Avvia.ps1 ../Avvia-XFiles*.cmd ../runtime/
          cp dists/engine-data/fonts.dat gui/themes/scummremastered.zip gui/themes/translations.dat ../runtime/
          cp -r LICENSES ../runtime/
          mkdir -p ../runtime/tools
          cp ../tools/prepare_data.mjs ../runtime/tools/
      - name: Verify packaged DLL closure and engine registration
        shell: pwsh
        run: python tools/verify_windows_package.py runtime
      - uses: actions/upload-artifact@v4
        with:
          name: ScummVM-XFiles-Shiloh-experimental-Windows
          path: runtime/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Shiloh-bridge-Cargo-lock
          path: bridge/Cargo.lock
