name: Verify experimental engine
on:
  push:
    paths:
      - 'engines/**'
      - 'tools/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'Prepara-e-Avvia.ps1'
      - 'Avvia-XFiles*.cmd'
      - '.github/workflows/verify.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise launcher with Windows PowerShell 5.1
        shell: pwsh
        run: ./tests/launcher.ps1
  database-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tests/prepare_data.mjs
      - run: node tests/prepare_audio.mjs
  scummvm-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Prepare pinned upstream without game data
        run: |
          git clone --filter=blob:none https://github.com/scummvm/scummvm.git upstream
          git -C upstream checkout 55c2973c1df5e8790b4248ae36a6b1b37842ce12
          python3 tools/install_engine.py upstream
          python3 tools/install_engine.py upstream
      - name: Compile detector and native engine
        working-directory: upstream
        run: |
          ./configure --disable-all-engines --enable-engine=xfiles --disable-debug
          make -j2 engines/xfiles/libxfiles.a engines/xfiles/detection.o
  windows-preview:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            python
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-pkgconf
      - name: Prepare reviewed ScummVM source
        run: |
          git clone --filter=blob:none https://github.com/scummvm/scummvm.git upstream
          git -C upstream checkout 55c2973c1df5e8790b4248ae36a6b1b37842ce12
          python tools/install_engine.py upstream
      - name: Build Windows preview
        working-directory: upstream
        run: |
          ./configure --disable-all-engines --enable-engine=xfiles --disable-debug --disable-updates --disable-cloud --disable-discord --disable-tts --disable-libcurl --enable-freetype2 --opengl-mode=none
          make -j4
          mkdir -p ../preview
          cp scummvm.exe ../preview/
          ldd scummvm.exe | awk '/\/mingw64\/bin\// {print $3}' | while read -r dll; do cp "$dll" ../preview/; done
          cp ../README.md ../LICENSE ../THIRD_PARTY.md ../preview/
          cp ../Prepara-e-Avvia.ps1 ../Avvia-XFiles*.cmd ../preview/
          cp dists/engine-data/fonts.dat gui/themes/scummremastered.zip gui/themes/translations.dat ../preview/
          cp -r LICENSES ../preview/
          mkdir -p ../preview/tools
          cp ../tools/prepare_data.mjs ../preview/tools/
      - uses: actions/upload-artifact@v4
        with:
          name: ScummVM-XFiles-Windows-preview
          path: preview/
